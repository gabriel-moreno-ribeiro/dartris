name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart compile exe bin/tetris.dart -o /tmp/tetris
      - name: build the Chrome extension
        run: dart compile js -O2 --no-source-maps web/main.dart -o extension/game.js
      - uses: actions/upload-artifact@v4
        with:
          name: dartris-extension
          path: extension
